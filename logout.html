<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - AI Courtroom</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logout-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1f2937;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="logout-box">
        <h2>Logout</h2>
        <p>You have successfully logged out.</p>

        <a href="{{ url_for('login') }}">
            Back to Login
        </a>
    </div>

</body>
</html>
